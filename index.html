<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>The Arena Brand Playbook</title>
<meta property="og:title" content="The Arena Brand Playbook">
<meta property="og:image" content="og.png">
<meta name="theme-color" content="#000000">
<style>
  :root { color-scheme: dark; --ink: #fff; --dim: rgba(255,255,255,.55); --line: rgba(255,255,255,.22); --hi: #FAFF00; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; background: #000; color: var(--ink); font: 400 15px/1.45 "Helvetica Neue", Helvetica, Arial, sans-serif; }
  body { display: grid; place-items: center; padding: 16px; }
  main { width: min(380px, 100%); }
  .eyebrow { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); }
  h1 { font-weight: 500; font-size: 26px; line-height: 1.15; margin: 10px 0 28px; }
  form { display: flex; gap: 8px; }
  input { flex: 1; min-width: 0; height: 44px; padding: 0 14px; border: 1px solid var(--line); border-radius: 0; background: transparent;
          color: var(--ink); font: inherit; outline: none; }
  input:focus { border-color: var(--ink); }
  button { height: 44px; padding: 0 18px; border: 0; border-radius: 0; background: var(--hi); color: #000; font: 500 14px/1 inherit; font-family: inherit; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  p.msg { min-height: 1.45em; margin-top: 12px; font-size: 13px; color: var(--dim); }
  p.msg.err { color: var(--ink); }
  a { color: var(--dim); }
</style>
</head>
<body>
<main>
  <p class="eyebrow">The Arena · Confidential</p>
  <h1>The Arena Brand Playbook</h1>
  <form id="f">
    <input id="pw" type="password" autocomplete="current-password" placeholder="Password" aria-label="Password" required autofocus>
    <button id="go" type="submit">Open</button>
  </form>
  <p class="msg" id="msg"></p>
</main>
<script>
// The gate for an encrypted guideline book (tools/playbook/build.mjs). The password never leaves the browser:
// it derives the AES key, which is checked against a sealed sample, kept in IndexedDB and used by sw.js.
const CFG = {"salt":"f0013b2e4dfaf694c5ac57ff78dead2f","iter":310000,"check":"XMnX7CgLeAFodFoUCXh6R2VPBYz2GlmUHYwnDQWhPSTjJaNYn2uKMjwZ"};
const $ = id => document.getElementById(id);
const say = (t, err) => { $("msg").textContent = t; $("msg").className = "msg" + (err ? " err" : ""); };
const hex = h => new Uint8Array(h.match(/../g).map(b => parseInt(b, 16)));
const idb = mode => new Promise((ok, no) => {
  const r = indexedDB.open("arena-playbook", 1);
  r.onupgradeneeded = () => r.result.createObjectStore("k");
  r.onsuccess = () => ok(r.result.transaction("k", mode).objectStore("k"));
  r.onerror = () => no(r.error);
});
const req = r => new Promise((ok, no) => { r.onsuccess = () => ok(r.result); r.onerror = () => no(r.error); });

async function fits(key) {
  const b = Uint8Array.from(atob(CFG.check), c => c.charCodeAt(0));
  try { await crypto.subtle.decrypt({ name: "AES-GCM", iv: b.slice(0, 12) }, key, b.slice(12)); return true; } catch { return false; }
}
async function enter() {
  const reg = await navigator.serviceWorker.register("sw.js");
  await navigator.serviceWorker.ready;
  if (!navigator.serviceWorker.controller)
    await new Promise(ok => navigator.serviceWorker.addEventListener("controllerchange", ok, { once: true }));
  navigator.serviceWorker.controller.postMessage("reset");
  location.reload();
}

(async () => {
  if (!("serviceWorker" in navigator) || !window.indexedDB || !crypto.subtle) {
    $("go").disabled = true;
    return say("This browser cannot open protected guidelines (private browsing can block it). Try a regular Chrome or Safari window.", true);
  }
  const saved = await req((await idb("readonly")).get("key")).catch(() => null);
  if (saved && await fits(saved)) { say("Opening…"); return enter(); }
  $("f").addEventListener("submit", async e => {
    e.preventDefault();
    $("go").disabled = true; say("Checking…");
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode($("pw").value), "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey({ name: "PBKDF2", hash: "SHA-256", salt: hex(CFG.salt), iterations: CFG.iter },
      base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    if (!await fits(key)) { $("go").disabled = false; $("pw").select(); return say("That password is not right.", true); }
    await req((await idb("readwrite")).put(key, "key"));
    say("Opening…"); enter();
  });
})();
</script>
</body>
</html>
